name: Keep Supabase awake

# Free Supabase projects pause after about a week without activity, which makes
# sign-up fail with "Couldn't reach the server". This pings the project once a day.
# The URL and the publishable key are public (they are in the website bundle too).
on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping the API and the auth service
        run: |
          URL="https://cwvuxemvbnzdofawcnty.supabase.co"
          KEY="sb_publishable_UfAeVNHDdJiJ8i_C_pk3aA_gfzUBPsQ"
          curl -fsS --retry 3 --retry-delay 10 "$URL/rest/v1/community_stats?select=*&limit=1" -H "apikey: $KEY" -o /dev/null
          curl -fsS --retry 3 --retry-delay 10 "$URL/auth/v1/health" -H "apikey: $KEY" -o /dev/null
          echo "Supabase is awake"
